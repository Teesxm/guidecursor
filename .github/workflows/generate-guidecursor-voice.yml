name: Generate GuideCursor voice clips

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-guidecursor-voice.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message || '', '[voice-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install neural TTS
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install edge-tts

      - name: Generate natural voice clips
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/guidecursor-natural
          mkdir -p /tmp/guidecursor-natural
          python3 - <<'PY'
          import asyncio
          from pathlib import Path
          import edge_tts

          phrases = {
            "ready": "GuideCursor ready. Tell me what you want to do. For example, attach my C V.",
            "attach": "Attach is the verified target. Move your pointer toward Attach.",
            "choose": "I found several files containing C V. Option A. C V 2026 PDF. Option B. C V Previous PDF. Option C. C V Design PDF. Which C V do you mean?",
            "file": "Choice received. Your chosen file is the target. Move your pointer toward that file and click it when I confirm you have reached it.",
            "open": "File selected. Open is now the verified target. Move your pointer toward Open and click it when I confirm you have reached it.",
            "complete": "Attachment complete. The selected C V is attached to the email.",
            "invalid-goal": "I need a clearer goal. Try: attach my C V.",
            "invalid-choice": "I did not catch that choice. Say A, B, C, first one, second one, third one, or the file name.",
            "no-speech": "I did not hear an answer. I will listen again.",
            "wrong-target": "That is not the verified target. Continue toward the verified target.",
            "target-found": "Target found. Click once.",
            "move-left": "Move left.",
            "move-right": "Move right.",
            "move-up": "Move up.",
            "move-down": "Move down.",
            "move-up-left": "Move up left.",
            "move-up-right": "Move up right.",
            "move-down-left": "Move down left.",
            "move-down-right": "Move down right.",
            "scroll-up": "Scroll up.",
            "scroll-down": "Scroll down.",
            "homepage-task1": "Blind guidance selected. Task one. Attach the file. GuideCursor has verified the Attach control. Move your pointer toward it and click when I confirm the target.",
            "homepage-task2": "Task two. Go to Research. Move toward the Research link in the navigation and click it.",
            "homepage-task3": "Task three. Open Screen Recognition. Move to the highlighted research card and click it.",
            "preview-complete": "Preview complete. You stayed in control of every click.",
            "target-activated": "Target activated.",
            "audio-enabled": "Audio guidance enabled."
          }
          async def main():
              root = Path("/tmp/guidecursor-natural")
              voice = "en-US-JennyNeural"
              for key, text in phrases.items():
                  out = root / f"{key}.mp3"
                  communicator = edge_tts.Communicate(
                      text=text,
                      voice=voice,
                      rate="-4%",
                      volume="+0%",
                      pitch="+0Hz",
                  )
                  await communicator.save(str(out))
                  if not out.exists() or out.stat().st_size < 1000:
                      raise RuntimeError(f"Invalid generated audio: {out}")

          asyncio.run(main())
          PY

          # Only replace the known-working clips after every neural clip succeeds.
          mkdir -p public/audio/guidecursor
          cp /tmp/guidecursor-natural/*.mp3 public/audio/guidecursor/

      - name: Commit generated audio
        run: |
          if git diff --quiet -- public/audio/guidecursor && [ -n "$(git ls-files public/audio/guidecursor)" ]; then
            echo "Voice assets already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/guidecursor
          git commit -m "Upgrade GuideCursor voice clips to natural neural speech [voice-assets]"
          git push
